<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two thrones, one hive">
  <title>Two thrones, one hive — Patricia governs, Barry executes</title>
  <desc>Two crowned bees on hexagon thrones: Patricia the Queen Bee over governance (rules-hive) and Barry the King Bee over execution (skills-hive), above a colony bar for ai-hive.</desc>

  <rect x="6" y="6" width="668" height="418" rx="28" fill="#FBF6EA" stroke="#EADFC6" stroke-width="2.5"/>

  <text x="340" y="50" font-family="'Poppins','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#17140F" text-anchor="middle">Two thrones, one hive</text>
  <text x="340" y="74" font-family="'Poppins','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#7A6B4F" text-anchor="middle">Patricia sets the law · Barry runs the fleet</text>

  <!-- Patricia's throne -->
  <polygon transform="translate(200,168)" points="50.2,29 0,58 -50.2,29 -50.2,-29 0,-58 50.2,-29" fill="#17140F" stroke="#17140F" stroke-width="4.5" stroke-linejoin="round"/>
  <g transform="translate(75,43)">
    <ellipse cx="116" cy="120" rx="9" ry="5.4" fill="#F7EFDD" opacity="0.92" transform="rotate(-28 116 120)"/>
    <ellipse cx="134" cy="120" rx="9" ry="5.4" fill="#F7EFDD" opacity="0.92" transform="rotate(28 134 120)"/>
    <rect x="118.5" y="117" width="13" height="27" rx="6.5" fill="#F2A81D"/>
    <rect x="118.5" y="124.5" width="13" height="3" rx="1" fill="#17140F"/>
    <rect x="118.5" y="132.5" width="13" height="3" rx="1" fill="#17140F"/>
    <circle cx="125" cy="115" r="5.2" fill="#17140F" stroke="#F2A81D" stroke-width="1.2"/>
    <rect x="113" y="106" width="24" height="3" rx="1.5" fill="#F2A81D"/>
    <circle cx="117" cy="103" r="2.4" fill="#F2A81D"/><circle cx="125" cy="101.5" r="2.7" fill="#F2A81D"/><circle cx="133" cy="103" r="2.4" fill="#F2A81D"/>
  </g>
  <g font-family="'Poppins','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="200" y="252" font-size="16" font-weight="800" fill="#17140F">PATRICIA</text>
    <text x="200" y="270" font-size="12" fill="#7A6B4F">the Queen Bee</text>
    <text x="200" y="288" font-size="12" font-weight="700" fill="#B9791A">Governance · rules-hive</text>
    <text x="200" y="304" font-size="10.5" fill="#7A6B4F">sets the law — AGENTS.md</text>
  </g>

  <!-- Barry's throne -->
  <polygon transform="translate(480,168)" points="50.2,29 0,58 -50.2,29 -50.2,-29 0,-58 50.2,-29" fill="#17140F" stroke="#17140F" stroke-width="4.5" stroke-linejoin="round"/>
  <g transform="translate(355,43)">
    <ellipse cx="116" cy="120" rx="9" ry="5.4" fill="#F7EFDD" opacity="0.92" transform="rotate(-28 116 120)"/>
    <ellipse cx="134" cy="120" rx="9" ry="5.4" fill="#F7EFDD" opacity="0.92" transform="rotate(28 134 120)"/>
    <rect x="118.5" y="117" width="13" height="27" rx="6.5" fill="#F2A81D"/>
    <rect x="118.5" y="124.5" width="13" height="3" rx="1" fill="#17140F"/>
    <rect x="118.5" y="132.5" width="13" height="3" rx="1" fill="#17140F"/>
    <circle cx="125" cy="115" r="5.2" fill="#17140F" stroke="#F2A81D" stroke-width="1.2"/>
    <path d="M118,109 L120.5,104 L123,108.5 L125,103 L127,108.5 L129.5,104 L132,109 Z" fill="#F2A81D"/>
    <circle cx="120.5" cy="104" r="1.3" fill="#F2A81D"/><circle cx="125" cy="103" r="1.4" fill="#F2A81D"/><circle cx="129.5" cy="104" r="1.3" fill="#F2A81D"/>
  </g>
  <g font-family="'Poppins','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="480" y="252" font-size="16" font-weight="800" fill="#17140F">BARRY</text>
    <text x="480" y="270" font-size="12" fill="#7A6B4F">the King Bee</text>
    <text x="480" y="288" font-size="12" font-weight="700" fill="#B9791A">Execution · skills-hive</text>
    <text x="480" y="304" font-size="10.5" fill="#7A6B4F">runs the fleet — SKILL.md</text>
  </g>

  <!-- the colony -->
  <rect x="140" y="330" width="400" height="66" rx="16" fill="#F6DCA0" stroke="#EADFC6" stroke-width="1.5"/>
  <text x="340" y="358" font-family="'Poppins','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="800" letter-spacing="0.5" fill="#17140F" text-anchor="middle">THE COLONY · ai-hive</text>
  <text x="340" y="378" font-family="'Poppins','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#7A6B4F" text-anchor="middle">workers: the harnesses · foraging: mcp-hive · comb: knowledge-hive</text>
</svg>
