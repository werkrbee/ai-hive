<svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="skills-hive">
  <title>skills-hive — Barry the king bee orchestrating a fleet of harness cells</title>

  <!-- umbilical: GitHub Copilot -> Scout (sub-harness) -->
  <rect x="232.5" y="121.5" width="11" height="7" rx="3" fill="#E1901A"/>

  <!-- Harness fleet cells -->
  <g fill="#F7EFDD" stroke="#17140F" stroke-width="4.5" stroke-linejoin="round">
    <polygon transform="translate(87.75,60.5)"  points="34.64,20 0,40 -34.64,20 -34.64,-20 0,-40 34.64,-20"/>
    <polygon transform="translate(162.25,60.5)" points="34.64,20 0,40 -34.64,20 -34.64,-20 0,-40 34.64,-20"/>
    <polygon transform="translate(199.5,125)"   points="34.64,20 0,40 -34.64,20 -34.64,-20 0,-40 34.64,-20"/>
    <polygon transform="translate(162.25,189.5)" points="34.64,20 0,40 -34.64,20 -34.64,-20 0,-40 34.64,-20"/>
    <polygon transform="translate(87.75,189.5)"  points="34.64,20 0,40 -34.64,20 -34.64,-20 0,-40 34.64,-20"/>
    <polygon transform="translate(50.5,125)"     points="34.64,20 0,40 -34.64,20 -34.64,-20 0,-40 34.64,-20"/>
  </g>

  <!-- Scout: child cell of GitHub Copilot -->
  <polygon transform="translate(261,125)" points="19.05,11 0,22 -19.05,11 -19.05,-11 0,-22 19.05,-11"
           fill="#F7EFDD" stroke="#17140F" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Center cell: the king's chamber -->
  <polygon transform="translate(125,125)" points="34.64,20 0,40 -34.64,20 -34.64,-20 0,-40 34.64,-20"
           fill="#17140F" stroke="#17140F" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Skill dots: each harness cell holds its agent skills -->
  <g fill="#E1901A">
    <circle cx="87.75" cy="52.5" r="3.8"/><circle cx="79.75" cy="66.5" r="3.8"/><circle cx="95.75" cy="66.5" r="3.8"/>
    <circle cx="154.25" cy="60.5" r="3.8"/><circle cx="170.25" cy="60.5" r="3.8"/>
    <circle cx="192.5" cy="118" r="3.8"/><circle cx="206.5" cy="118" r="3.8"/><circle cx="192.5" cy="132" r="3.8"/><circle cx="206.5" cy="132" r="3.8"/>
    <circle cx="162.25" cy="181.5" r="3.8"/><circle cx="154.25" cy="195.5" r="3.8"/><circle cx="170.25" cy="195.5" r="3.8"/>
    <circle cx="79.75" cy="189.5" r="3.8"/><circle cx="95.75" cy="189.5" r="3.8"/>
    <circle cx="50.5" cy="117" r="3.8"/><circle cx="42.5" cy="131" r="3.8"/><circle cx="58.5" cy="131" r="3.8"/>
    <circle cx="255" cy="125" r="2.6"/><circle cx="267" cy="125" r="2.6"/>
  </g>

  <!-- Barry: the king bee -->
  <g>
    <ellipse cx="116" cy="120" rx="9" ry="5.4" fill="#F7EFDD" opacity="0.92" transform="rotate(-28 116 120)"/>
    <ellipse cx="134" cy="120" rx="9" ry="5.4" fill="#F7EFDD" opacity="0.92" transform="rotate(28 134 120)"/>
    <rect x="118.5" y="117" width="13" height="27" rx="6.5" fill="#F2A81D"/>
    <rect x="118.5" y="124.5" width="13" height="3" rx="1" fill="#17140F"/>
    <rect x="118.5" y="132.5" width="13" height="3" rx="1" fill="#17140F"/>
    <circle cx="125" cy="115" r="5.2" fill="#17140F"/>
    <path d="M118,109 L120.5,104 L123,108.5 L125,103 L127,108.5 L129.5,104 L132,109 Z" fill="#F2A81D"/>
    <circle cx="120.5" cy="104" r="1.2" fill="#F2A81D"/>
    <circle cx="125" cy="103" r="1.3" fill="#F2A81D"/>
    <circle cx="129.5" cy="104" r="1.2" fill="#F2A81D"/>
  </g>
</svg>
