<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Patricia — the Queen Bee, governance guardian">
  <title>Patricia — the Queen Bee</title>
  <desc>A banner: a crowned queen bee medallion on the left, with the name patricia and the titles the Queen Bee and governance guardian, keeper of the charter.</desc>
  <rect x="1.5" y="1.5" width="757" height="237" rx="30" fill="#FBF6EA" stroke="#EADFC6" stroke-width="2.5"/>

  <polygon transform="translate(120,120)" points="60.6,35 0,70 -60.6,35 -60.6,-35 0,-70 60.6,-35" fill="none" stroke="#F2A81D" stroke-width="3"/>
  <polygon transform="translate(120,120)" points="55.4,32 0,64 -55.4,32 -55.4,-32 0,-64 55.4,-32" fill="#17140F" stroke="#17140F" stroke-width="4.5" stroke-linejoin="round"/>
  <g transform="translate(120,120) scale(1.55) translate(-125,-125)">
    <ellipse cx="116" cy="120" rx="9.5" ry="5.8" fill="#F7EFDD" opacity="0.95" transform="rotate(-28 116 120)"/>
    <ellipse cx="134" cy="120" rx="9.5" ry="5.8" fill="#F7EFDD" opacity="0.95" transform="rotate(28 134 120)"/>
    <rect x="118.5" y="117" width="13" height="27" rx="6.5" fill="#F2A81D"/>
    <rect x="118.5" y="124.5" width="13" height="3" rx="1" fill="#17140F"/>
    <rect x="118.5" y="132.5" width="13" height="3" rx="1" fill="#17140F"/>
    <circle cx="125" cy="115" r="5.2" fill="#17140F" stroke="#F2A81D" stroke-width="1"/>
    <rect x="112.5" y="105.5" width="25" height="3.2" rx="1.6" fill="#F2A81D"/>
    <circle cx="116.5" cy="102.5" r="2.5" fill="#F2A81D"/><circle cx="125" cy="100.8" r="2.9" fill="#F2A81D"/><circle cx="133.5" cy="102.5" r="2.5" fill="#F2A81D"/>
  </g>

  <g font-family="'Poppins','Futura','Century Gothic','Trebuchet MS','Helvetica Neue',Arial,sans-serif">
    <text x="250" y="126" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#17140F">patricia</text>
    <rect x="252" y="144" width="52" height="4" rx="2" fill="#F2A81D"/>
    <text x="252" y="174" font-size="16.5" font-weight="700" letter-spacing="3.2" fill="#17140F">THE QUEEN BEE</text>
    <text x="252" y="198" font-size="14" font-weight="500" letter-spacing="0.5" fill="#7A6B4F">Governance guardian · keeper of the charter</text>
  </g>
</svg>
