# Configuration for hive_a2a. Copy it, fill in the values, and pass it with --config.
# Relative paths for database, ledger and jwks_path are from this file's directory;
# prompt_files are from the repo root. No secret goes in this file.

[server]
persona = "patricia"                 # cards/<persona>/card.json
capability = "governance-review"     # contracts/<capability>/contract.json
public_url = "https://patricia.example.org/"   # where callers reach the JSON-RPC endpoint
database = "data/tasks.db"           # SQLite; tasks survive restarts
ledger = "data/ledger.jsonl"         # knowledge-hive ledger format
monthly_ceiling_usd = 25.0
# Other processes' ledgers that spend against the same ceiling, such as a scheduled eval's.
# shared_ledgers = ["data/ledger-eval.jsonl"]
prompt_files = [
  "hives/rules-hive/rules/queen-charter/AGENTS.md",
  "hives/skills-hive/skills/patricia/SKILL.md",
  "hives/agents-hive/agents/charter-review/agent.md",
]

[auth]
# Microsoft Entra: replace <tenant-id> and <api-app-id> with the server's app registration.
issuer = "https://login.microsoftonline.com/<tenant-id>/v2.0"
audience = "<api-app-id>"
jwks_url = "https://login.microsoftonline.com/<tenant-id>/discovery/v2.0/keys"
token_url = "https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token"
scope = "api://<api-app-id>/.default"
allowed_clients = ["<caller-app-id>"]   # one entry per product allowed to call
# client_claims = ["azp", "appid"]
# required_roles = ["Review.Request"]

[model]
api = "stub"                         # stub | messages | chat-completions: the wire API, not the vendor
name = "stub"                        # on Foundry, the deployment name
# publisher = "OpenAI"               # who made the model, for the ledger: on Foundry, its catalog format
# base_url = "https://<resource>.services.ai.azure.com/anthropic"   # messages: Claude on Foundry
# base_url = "https://<resource>.openai.azure.com/openai/v1"         # chat-completions: the other models on Foundry
# auth = "entra"                     # entra (managed identity) | api-key
# api_key_env = "MODEL_API_KEY"      # with auth = "api-key"
input_usd_per_mtok = 0.0             # the model's list price, for the ledger and the ceiling
output_usd_per_mtok = 0.0
max_output_tokens = 4000

# Hosted Barry only: with server.capability = "orchestration" (and persona = "barry",
# prompt_files his Charter and skill), the loop's runs, delegates and callers.
# [orchestration]
# passport = "barry"                 # passports/<passport>, the runs' bounds
# state_dir = "data/runs"            # engine run records; audit.jsonl and queue/ go beside it
# sweep_seconds = 3600               # how often paused runs are checked for expiry
# reviewer = "patricia"              # a delegate that reviews each gated action before it pauses
# request_roles = ["Orchestration.Request"]   # to start or cancel a task (the defaults)
# approve_roles = ["Orchestration.Approve"]   # to answer an approval
#
# [[orchestration.delegates]]        # an A2A agent the passport lists in its delegates
# name = "patricia"
# url = "https://patricia.example.org/"
# capability = "governance-review"
# token_scope = "api://<patricia-api-app-id>/.default"
#
# [[orchestration.callers]]          # a client on auth.allowed_clients, and its registration
# client = "<caller-app-id>"
# registration = "lineup"            # registrations/<registration>/registration.json
