name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate artifacts & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer checks (syntax + sandboxed smoke install)
        run: ./scripts/check-installers.sh

      - name: Validate SKILL.md / AGENTS.md artifacts
        run: ./scripts/validate-artifacts.sh

      - name: ShellCheck (non-blocking)
        continue-on-error: true
        run: |
          if command -v shellcheck >/dev/null; then
            find . -type f -name '*.sh' -not -path './.git/*' -exec shellcheck {} +
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            find . -type f -name '*.sh' -not -path './.git/*' -exec shellcheck {} +
          fi

  a2a-server:
    name: A2A server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hives/agents-hive/servers/a2a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hives/agents-hive/servers/a2a/requirements.txt

      - name: Install the server's requirements
        run: pip install -r requirements.txt

      - name: Smoke tests (stub model, no network)
        run: python -m unittest discover -s tests -v
