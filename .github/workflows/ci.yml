name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate artifacts & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (scripts + installers)
        run: |
          found=0
          while IFS= read -r -d '' f; do
            found=1
            bash -n "$f" && echo "ok  $f"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          [ "$found" -eq 1 ] || echo "no shell scripts found"

      - name: Validate SKILL.md / AGENTS.md artifacts
        run: |
          chmod +x scripts/validate-artifacts.sh
          ./scripts/validate-artifacts.sh

      - name: ShellCheck (non-blocking)
        continue-on-error: true
        run: |
          if command -v shellcheck >/dev/null; then
            find . -type f -name '*.sh' -not -path './.git/*' -exec shellcheck {} +
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            find . -type f -name '*.sh' -not -path './.git/*' -exec shellcheck {} +
          fi
