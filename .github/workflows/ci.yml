name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate artifacts & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Open-weight collector offline tests
        run: python3 -m unittest discover -s tests -p 'test_open_weight_models.py' -v

      - name: FinOps planning synthetic tests
        run: python3 -m unittest discover -s tests -p 'test_finops_plan.py' -v

      - name: Installer checks (syntax + sandboxed smoke install)
        run: ./scripts/check-installers.sh

      - name: Validate SKILL.md / AGENTS.md artifacts
        run: ./scripts/validate-artifacts.sh

      - name: Harness registry and adapters agree
        run: python3 -B scripts/harnesses.py check

      - name: Architecture diagram is current
        run: python3 scripts/architecture.py --check

      - name: Compile the Azure deployment (Bicep)
        run: |
          az bicep install
          az bicep build --file hives/agents-hive/deploy/azure/main.bicep --stdout > /dev/null
          az bicep lint --file hives/agents-hive/deploy/azure/main.bicep
          az bicep build-params --file hives/agents-hive/deploy/azure/main.example.bicepparam --stdout > /dev/null

      - name: ShellCheck (non-blocking)
        continue-on-error: true
        run: |
          if command -v shellcheck >/dev/null; then
            find . -type f -name '*.sh' -not -path './.git/*' -exec shellcheck {} +
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            find . -type f -name '*.sh' -not -path './.git/*' -exec shellcheck {} +
          fi

  a2a-server:
    name: A2A server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hives/agents-hive/servers/a2a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hives/agents-hive/servers/a2a/requirements.txt

      - name: Install the server's requirements
        run: pip install -r requirements.txt

      - name: Smoke tests (stub model, no network)
        run: python -m unittest discover -s tests -v
