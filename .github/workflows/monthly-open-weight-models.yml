name: Monthly open-weight model review
on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official model metadata
        run: python3 scripts/update_open_weight_models.py
      - name: Propose reviewed snapshot
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/monthly-open-weight-models
          delete-branch: true
          commit-message: 'docs: refresh monthly open-weight model metadata'
          title: 'docs: monthly open-weight model license and download review'
          body: |
            Automated model-card metadata snapshot only. **Do not merge without human review.**
            Validate the exact upstream LICENSE and acceptable-use terms, download availability,
            new releases, hardware requirements and this month's rankings before approving.
            Update docs/open-weight-model-intelligence.md when the editorial assessment changes.
          add-paths: docs/open-weight-models-monthly.json
