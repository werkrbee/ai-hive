name: Monthly open-weight model review
on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  review-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run offline collector tests
        run: python3 -m unittest discover -s tests -p 'test_open_weight_models.py' -v
      - name: Fetch official model metadata
        run: python3 scripts/update_open_weight_models.py
      - name: Propose a review PR if snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/propose_open_weight_review.sh
