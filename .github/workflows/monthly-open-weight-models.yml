name: Monthly open-weight model review
on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  review-models:
    # Serialize collection and proposal across scheduled, manual and reusable calls.
    concurrency:
      group: open-weight-model-review-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run offline collector tests
        run: python3 -m unittest discover -s tests -p 'test_open_weight_models.py' -v
      - name: Fetch official model metadata
        run: python3 scripts/update_open_weight_models.py
      - name: Propose a review PR if snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/propose_open_weight_review.sh
